name: Deploy to Production

on:
  push:
    branches:
      - baseffshop
    paths-ignore:
      - 'app/page.tsx'  # Ignorar página inicial
      - 'components/UserVerification.tsx'  # Ignorar tema

jobs:
  deploy:
    name: Deploy to Servers
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to ffireshop
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /var/www/ffireshop
            echo "🔄 Fetching latest changes from baseffshop..."
            git fetch origin baseffshop
            echo "📥 Updating only API files (keeping current page.tsx)..."
            git checkout origin/baseffshop -- app/api/
            git checkout origin/baseffshop -- lib/
            git checkout origin/baseffshop -- hooks/
            git checkout origin/baseffshop -- components/DevToolsBlocker.tsx
            git checkout origin/baseffshop -- components/VerificationWrapper.tsx
            echo "🗑️ Removing unnecessary folders and cache..."
            rm -rf app/admin-simple app/debug .next node_modules/.cache
            echo "📦 Installing dependencies..."
            npm install --production
            echo "🔨 Building..."
            npm run build
            echo "♻️ Restarting PM2..."
            pm2 restart ffireshop
            echo "✅ Deploy completed for ffireshop"

      - name: Deploy to promocoes-qpon
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /var/www/promocoes-qpon
            echo "🔄 Fetching latest changes from baseffshop..."
            git fetch origin baseffshop
            echo "📥 Updating only API files (keeping current page.tsx)..."
            git checkout origin/baseffshop -- app/api/
            git checkout origin/baseffshop -- lib/
            git checkout origin/baseffshop -- hooks/
            git checkout origin/baseffshop -- components/DevToolsBlocker.tsx
            git checkout origin/baseffshop -- components/VerificationWrapper.tsx
            echo "🗑️ Removing unnecessary folders and cache..."
            rm -rf app/admin-simple app/debug .next node_modules/.cache
            echo "📦 Installing dependencies..."
            npm install --production
            echo "🔨 Building..."
            npm run build
            echo "♻️ Restarting PM2..."
            pm2 restart promocoes-qpon
            echo "✅ Deploy completed for promocoes-qpon"

      - name: Deploy to free-gamerecargas-site
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /var/www/free-gamerecargas-site
            echo "🔄 Fetching latest changes from baseffshop..."
            git fetch origin baseffshop
            echo "📥 Updating only API files (keeping current page.tsx)..."
            git checkout origin/baseffshop -- app/api/
            git checkout origin/baseffshop -- lib/
            git checkout origin/baseffshop -- hooks/
            git checkout origin/baseffshop -- components/DevToolsBlocker.tsx
            git checkout origin/baseffshop -- components/VerificationWrapper.tsx
            echo "🗑️ Removing unnecessary folders and cache..."
            rm -rf app/admin-simple app/debug .next node_modules/.cache
            echo "📦 Installing dependencies..."
            npm install --production
            echo "🔨 Building..."
            npm run build
            echo "♻️ Restarting PM2..."
            pm2 restart free-gamerecargas-site
            echo "✅ Deploy completed for free-gamerecargas-site"

      - name: Notify Success
        if: success()
        run: echo "🎉 Deploy completed successfully to all servers!"

      - name: Notify Failure
        if: failure()
        run: echo "❌ Deploy failed! Check logs for details."
